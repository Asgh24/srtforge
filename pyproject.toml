[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srtforge"
version = "0.1.0"
description = "Desktop app for translating SRT subtitle files via LLM APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "SRTForge Contributors"}]
keywords = ["subtitle", "translation", "srt", "llm", "openrouter", "qt", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "pysubs2>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "pyinstaller>=6.0",
    "responses>=0.25",
    "hypothesis>=6.100",
]
tokenize = [
    "tiktoken>=0.7",
]

[project.scripts]
srtforge = "srtforge.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/srtforge"
Issues = "https://github.com/yourusername/srtforge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
srtforge = ["resources/qss/*.qss", "resources/icons/*.svg", "resources/icons/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]
